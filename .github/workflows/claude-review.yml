# PR が開かれたら Claude Code が自動でレビューし、コメントで指摘する（コメントのみ。マージは止めない）
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # fork からの PR では Secret が使えないため対象外。下書き PR も対象外
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューし、日本語でコメントしてください。コードは変更せず、コメントだけを出します。

            このアプリは本番で実運用中です。まず最初に、「マージすると本番の運用が止まる、または使えなくなるような重大な変更が入っていないか」を確認してください。細かい点より、これを最優先にします。

            本番が止まる重大な変更の例:
            - 出欠の回答、参加リンク、LINE の通知やカードなど、普段の運用に必要な機能が動かなくなる
            - スプレッドシートの列・シート名・値の形が変わり、既存のデータが読めなくなる、壊れる、消える、二重に登録される
            - すでに配った参加リンクが開けなくなる
            - GAS のデプロイや GitHub Pages の公開が失敗する、または古い設定のまま壊れた状態で公開される
            - 起動時や画面の表示時に必ずエラーになる（ビルド・型・テストが通らない状態を含む）

            まず CLAUDE.md を読み、次の順で差分を確認します（上ほど優先）。
            1. 本番が止まる重大な変更: 上の例に当てはまるものがあれば、最も目立つ形で強く指摘し、「どの機能が、どういう条件で、どう止まるか」を書く。なければ「重大な変更は見当たらない」と、確認した範囲を添えて書く
            2. 動作の不具合、抜け漏れ、境界条件の見落とし（本番が止まるほどではないもの）
            3. テストが足りているか（特に、既存の動きを守るテスト）
            4. ユーザーに見える文字列が docs/glossary.md の用語集に沿っているか、「使わない言い方」が入っていないか
            5. CHANGELOG・タグ・コミットなど公開する文に、使っているグループの名前や内輪の言い方が入っていないか

            出し方:
            - 行ごとの指摘は、インラインコメントで出す
            - 最後に、全体の所見を PR コメントに1つだけまとめる。冒頭に「本番が止まる重大な変更: あり（内容）/ 見当たらない」を1行で書き、続けて直してほしい点を優先度の高い順に並べる（良い点は1〜2行）
            - 直してほしい点は「何を・なぜ・どう直すか」を具体的に書く
            - 好みの問題や細かすぎる指摘は出さない
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
