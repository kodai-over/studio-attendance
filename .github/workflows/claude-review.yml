# PR が開かれたら Claude Code が自動でレビューし、コメントで指摘する（コメントのみ。マージは止めない）
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # fork からの PR では Secret が使えないため対象外。下書き PR も対象外
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストをレビューし、日本語でコメントしてください。コードは変更せず、コメントだけを出します。

            このアプリは実運用中です。今動いている機能（出欠の回答、参加リンク、LINE のカード、スプレッドシートの読み書き、GAS のデプロイ）に影響しそうな点を、最優先で探してください。

            まず CLAUDE.md を読み、次の順で差分を確認します（上ほど優先）。
            1. 今動いている機能への影響: 既存の動きが変わる・壊れる恐れ、シートの列や値の変更、既存の参加リンクが開けなくなる変更、データが消える・二重に登録される恐れ（壊す恐れがあれば強く指摘し、どの機能がどう壊れるかを書く）
            2. 動作の不具合、抜け漏れ、境界条件の見落とし
            3. テストが足りているか（特に、既存の動きを守るテスト）
            4. ユーザーに見える文字列が docs/glossary.md の用語集に沿っているか、「使わない言い方」が入っていないか
            5. CHANGELOG・タグ・コミットなど公開する文に、使っているグループの名前や内輪の言い方が入っていないか

            出し方:
            - 行ごとの指摘は、インラインコメントで出す
            - 最後に、全体の所見を PR コメントに1つだけまとめる。冒頭に「今動いている機能への影響: あり（内容）/ なし」を1行で書き、続けて直してほしい点を優先度の高い順に並べる（良い点は1〜2行）
            - 直してほしい点は「何を・なぜ・どう直すか」を具体的に書く
            - 好みの問題や細かすぎる指摘は出さない
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
